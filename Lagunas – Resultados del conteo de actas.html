<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lagunas – Resultados del conteo de actas</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef2f7;--card:#fff;--tx:#0f1d33;--mut:#5b6b82;--navy:#0A2446;--b1:#2b5fa8;--b2:#8fb0de;--line:#dbe3ee;--amb:#f2a900;--gry:#9aa7b8;--trk:#e6ecf5}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1424;--card:#13203a;--tx:#e8eefb;--mut:#9db0cc;--line:#25344f;--b1:#5b93e0;--b2:#3a5f96;--gry:#6b7a90;--trk:#1d2d4a}}
:root[data-theme="dark"]{--bg:#0b1424;--card:#13203a;--tx:#e8eefb;--mut:#9db0cc;--line:#25344f;--b1:#5b93e0;--b2:#3a5f96;--gry:#6b7a90;--trk:#1d2d4a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.35}
.top{background:#0A2446;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
.logo{background:#fff;color:#0A2446;font-weight:800;letter-spacing:.18em;font-size:12px;padding:8px 10px;border-radius:8px;flex:none}
.top h1{font-size:16px;margin:0;line-height:1.2}.top p{margin:2px 0 0;font-size:12px;opacity:.8}
main{max-width:560px;margin:0 auto;padding:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tabs button{font:inherit;font-weight:700;font-size:15px;padding:16px 8px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--tx);cursor:pointer;transition:.2s}
.tabs button[aria-pressed="true"]{background:#0A2446;color:#fff;border-color:#0A2446;box-shadow:0 6px 16px rgba(10,36,70,.28)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(10,36,70,.06)}
.card h2{margin:0 0 12px;font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.av{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:120px;height:120px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px}
.av .t b{font-size:20px;display:block;line-height:1.2}.av .t span{display:block;color:var(--mut);font-size:14px;margin-top:4px}
.note{margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(242,169,0,.15);color:var(--tx);font-size:14px}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.sym{width:44px;height:44px;border-radius:50%;background:#0A2446;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid var(--b2)}
.sym img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.nm{font-size:14px;font-weight:700;margin-bottom:6px}
.trk{height:12px;background:var(--trk);border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--b2),var(--b1));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.row.first .fill{background:linear-gradient(90deg,#1b4a8a,#0A2446)}
.vl{text-align:right;min-width:64px}.vl b{display:block;font-size:17px}.vl span{font-size:12px;color:var(--mut)}
.sum{display:flex;align-items:center;gap:16px}
.leg{flex:1;font-size:14px}.leg div{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.leg div:last-child{border:0;font-weight:800;padding-top:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.aviso{font-size:12px;color:var(--mut);text-align:center;margin:6px 0}
footer{text-align:center;font-size:12px;color:var(--mut);padding:6px 0 18px}
</style></head><body>
<header class="top"><div class="logo">NEXORA</div><div><h1>Distrito de Lagunas – Resultados del conteo de actas</h1><p>Elecciones Regionales y Municipales 2026</p></div></header>
<main>
<nav class="tabs" id="tabs"></nav>
<div id="out"></div>
<p class="aviso">Resultados referenciales según las actas contabilizadas localmente. No son resultados oficiales.</p>
</main>
<footer>Desarrollado por NEXORA Soluciones Tecnológicas</footer>
<script>
/* ===== DATOS: aquí se actualizan los resultados ===== */
const TOTAL = 29; // total de actas
const ELECTORES = 0; // total de electores del distrito, ej. 5230
const PART_PRES = null; // % de participación en las presidenciales, ej. 78.5
/* electores hábiles de las actas ya contabilizadas, por sección (al llegar a 29 actas = ELECTORES) */
const ELEC_CONT = {regional:0, consejeros:0, provincial:0, distrital:0};
const BASE = [["ACCIÓN POPULAR","AP"],["ALIANZA PARA EL PROGRESO","APP"],["FUERZA POPULAR","FP"],["JUNTOS POR EL PERÚ","JP"],["APRA","APRA"],["SOMOS PERÚ","SP"],["PODEMOS PERÚ","PP"],["RENOVACIÓN POPULAR","RP"]];
/* actas = actas contabilizadas; act = fecha y hora; v = votos de cada partido (mismo orden de BASE); b = blancos; n = nulos */
const DATA = {
 regional:   {nombre:"Regional",           p:BASE, actas:0, act:"", v:[0,0,0,0,0,0,0,0], b:0, n:0},
 consejeros: {nombre:"Consejero regional", p:BASE, actas:0, act:"", v:[0,0,0,0,0,0,0,0], b:0, n:0},
 provincial: {nombre:"Provincial",         p:BASE, actas:0, act:"", v:[0,0,0,0,0,0,0,0], b:0, n:0},
 distrital:  {nombre:"Distrital",          p:BASE, actas:0, act:"", v:[0,0,0,0,0,0,0,0], b:0, n:0}
};
/* ================================================== */
const fmt=n=>{const r=Math.round(n*10)/10;return r%1===0?r.toFixed(0):r.toFixed(1)};
const num=n=>Number(n).toLocaleString("en-US");
let cur="regional";
function seg(len,off,col,C){return `<circle cx="50" cy="50" r="40" fill="none" stroke="${col}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"/>`}
function render(){
 const d=DATA[cur], a=Math.min(d.actas,TOTAL), av=a/TOTAL*100;
 const rows=d.p.map((p,i)=>({n:p[0],s:p[1],img:p[2]||"",v:d.v[i]||0,i}));
 const val=rows.reduce((t,r)=>t+r.v,0), emi=val+d.b+d.n;
 rows.forEach(r=>r.pc=val?r.v/val*100:0);
 rows.sort((x,y)=>y.v-x.v||x.i-y.i);
 const mx=rows[0]?rows[0].pc:0;
 const pv=emi?val/emi*100:0, pb=emi?d.b/emi*100:0, pn=emi?d.n/emi*100:0;
 const R=52,C1=2*Math.PI*R, C2=2*Math.PI*40;
 const l1=C2*pv/100,l2=C2*pb/100,l3=C2*pn/100;
 const ring=`<div class="ring"><svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--trk)" stroke-width="12"/><circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--b1)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C1*av/100} ${C1}"/></svg><div class="c">${fmt(av)} %</div></div>`;
 let h=`<section class="card"><h2>${d.nombre} · Avance</h2><div class="av">${ring}<div class="t"><b>${a} actas de ${TOTAL}</b><span>Conteo general al ${fmt(av)} %</span>${d.act?`<span>Actualizado: ${d.act}</span>`:""}</div></div>${a===0?'<div class="note">Aún no hay actas contabilizadas.</div>':""}</section>`;
 const ec=ELEC_CONT[cur]||0, pErm=ec?emi/ec*100:null;
 const g=(t,p,s)=>`<div style="margin-top:14px"><div style="display:flex;justify-content:space-between;font-size:14px;font-weight:700"><span>${t}</span><span>${p==null?"Sin datos":fmt(p)+" %"}</span></div><div class="trk" style="margin-top:6px"><div class="fill" data-w="${p==null?0:Math.min(p,100)}"></div></div>${s?`<div style="font-size:12px;color:var(--mut);margin-top:4px">${s}</div>`:""}</div>`;
 h+=`<section class="card"><h2>Participación ciudadana</h2><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="color:var(--mut);font-size:14px">Total de electores</span><b style="font-size:24px">${ELECTORES?num(ELECTORES):"Sin datos"}</b></div>`+g("Elecciones presidenciales",PART_PRES,"")+g("Elecciones regionales y municipales",pErm,ec?`${num(emi)} votos emitidos de ${num(ec)} electores hábiles (actas contabilizadas)`:"")+`</section>`;
 h+=`<section class="card"><h2>Resultados por partido</h2>`+rows.map((r,k)=>`<div class="row${k===0&&val?" first":""}"><div class="sym">${r.img?`<img src="${r.img}" alt="">`:r.s}</div><div><div class="nm">${r.n}</div><div class="trk"><div class="fill" data-w="${mx?r.pc/mx*100:0}"></div></div></div><div class="vl"><b>${fmt(r.pc)} %</b><span>${num(r.v)} votos</span></div></div>`).join("")+`</section>`;
 h+=`<section class="card"><h2>Resumen de votos</h2><div class="sum"><svg width="120" height="120" viewBox="0 0 100 100" style="transform:rotate(-90deg);flex:none"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--trk)" stroke-width="16"/>${emi?seg(l1,0,"var(--b1)",C2)+seg(l2,l1,"var(--amb)",C2)+seg(l3,l1+l2,"var(--gry)",C2):""}</svg><div class="leg"><div><span><i class="dot" style="background:var(--b1)"></i>Votos válidos</span><span>${num(val)} · ${fmt(pv)} %</span></div><div><span><i class="dot" style="background:var(--amb)"></i>En blanco</span><span>${num(d.b)} · ${fmt(pb)} %</span></div><div><span><i class="dot" style="background:var(--gry)"></i>Nulos o viciados</span><span>${num(d.n)} · ${fmt(pn)} %</span></div><div><span>Total emitidos</span><span>${num(emi)}</span></div></div></div></section>`;
 document.getElementById("out").innerHTML=h;
 requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll(".fill").forEach(f=>f.style.width=f.dataset.w+"%")));
 document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===cur));
}
document.getElementById("tabs").innerHTML=Object.keys(DATA).map(k=>`<button data-k="${k}">${DATA[k].nombre}</button>`).join("");
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b){cur=b.dataset.k;render()}});
render();
</script></body></html>
